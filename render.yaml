# Render "Blueprint": describes the two hosted services so Render can create them from this
# repository (Render dashboard -> New -> Blueprint). See docs/HOSTING.md for the steps.
#
# Values marked `sync: false` are secrets or addresses you type into the Render dashboard -
# they are never stored in this public repository.

services:
  # The website + API: one Node service. It builds the React app, then serves it together with
  # the API from the same address (server/src/app.ts), and runs the background jobs (expiry,
  # notifications, retention).
  - type: web
    name: kurumanmarketplace
    runtime: node
    # Free plan: after 15 minutes without visitors the site sleeps and the next visit takes about a minute to
    # wake it. It ran on the paid plan (0.5c-512mb, never sleeps) from 5 Nov 2026 for the presentation and was
    # moved back to free on 11 Nov 2026; "free" here keeps a Blueprint sync from switching the paid plan back on.
    plan: free
    region: frankfurt # closest Render region to South Africa at the time of writing
    buildCommand: >-
      cd client && npm ci --include=dev && npm run build &&
      cd ../server && npm ci --include=dev && npm run build
    startCommand: cd server && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production # also makes the login cookie HTTPS-only
      - key: DATABASE_URL
        sync: false # from Neon
      - key: DATABASE_SSL
        value: "true"
      - key: CLIENT_ORIGIN
        sync: false # the site's address(es), comma-separated: https://kurumanmarketplace.co.za,https://<your-service>.onrender.com
      - key: PUBLIC_APP_URL
        sync: false # the same address
      - key: TRUST_PROXY
        value: "1" # Render's proxy in front of the app (check the Payfast IP check after the first payment)
      - key: DATA_ENCRYPTION_KEY
        sync: false # 32 random bytes, base64 - make a NEW one, don't reuse your laptop's
      - key: AI_SERVICE_URL
        sync: false # https://<your-ai-service>.onrender.com
      - key: AI_SERVICE_TOKEN
        fromService:
          type: web
          name: kurumanmarketplace-ai
          envVarKey: AI_SERVICE_TOKEN
      # Product and shop photos (cloudinary://API_KEY:API_SECRET@CLOUD_NAME from the Cloudinary dashboard).
      # Without it, photos are kept in the database instead.
      - key: CLOUDINARY_URL
        sync: false
      # The SMS gateway calls /api/sms/inbound?token=... with replies; this is that secret token.
      - key: SMS_INBOUND_TOKEN
        generateValue: true
      # Real SMS through BulkSMS (Settings -> API Tokens). Without them, SMS are only logged.
      - key: BULKSMS_TOKEN_ID
        sync: false
      - key: BULKSMS_TOKEN_SECRET
        sync: false
      # Email through Resend: notices for the site's admin (e.g. a new seller application to check).
      # Without the key, emails are only written to the log. See docs/HOSTING.md, section 6e.
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false # where admin notices go (at first: the email address of the Resend account)
      # Free calls over data (Twilio console). All six are needed; without them the "Call free" buttons stay hidden.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_TWIML_APP_SID
        sync: false
      - key: TWILIO_CALLER_ID
        sync: false
      # Sign-in codes go out by real SMS (BulkSMS). "true" would show every code on screen - only for a demo
      # with made-up accounts, because then anyone could sign in as any number.
      - key: SMS_DEMO_SHOW_CODES
        value: "false"
      # "true" = Payfast's sandbox (test money), "false" = the live account (real money). Sandbox for now: the live
      # merchant account is "pending verification" at Payfast. Once Payfast verifies it, set "false" here AND put
      # the live merchant ID, key and passphrase back in the Render dashboard.
      - key: PAYFAST_SANDBOX
        value: "true"
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PAYFAST_NOTIFY_URL
        sync: false # https://<your-service>.onrender.com/api/payments/payfast/notify

  # The AI category model (Python). Only answers requests carrying the secret token.
  - type: web
    name: kurumanmarketplace-ai
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r ai/requirements.txt
    startCommand: python ai/service.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: AI_SERVICE_HOST
        value: 0.0.0.0 # listen on the network interface, not only on this machine
      - key: AI_SERVICE_TOKEN
        generateValue: true # Render makes a random secret; the website service reads it from here
